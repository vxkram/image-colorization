<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorized Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patua+One&family=Protest+Strike&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>RESULT</h1>
        <div class="result-images">
            <figure>
                <img src="{{ url_for('uploaded_file', filename=original) }}" alt="Original image">
                <figcaption>Original</figcaption>
            </figure>
            <figure>
                <img src="{{ url_for('uploaded_file', filename=colorized) }}" alt="Colorized image">
                <figcaption>Colorized</figcaption>
            </figure>
        </div>
        <a href="{{ url_for('index') }}" class="back-link">&larr; Colorize another image</a>
    </div>
</body>
</html>
